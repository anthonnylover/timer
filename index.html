<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>En el Músculo Timer</title>
<meta name="description" content="Timer de entrenamiento con modo MIX: For Time, AMRAP, EMOM y Tabata.">
<meta name="theme-color" content="#050d1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EEM Timer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow:wght@400;600;700&display=swap">
<style>
/* Layout: cabecera de marca, reloj grande arriba, debajo el constructor MIX (bloques apilados). Al entrenar se oculta el constructor. */
:root {
  color-scheme: dark;
  --bg: #050d1f;          /* azul noche del logo */
  --panel: #0c1a36;
  --panel-2: #12264a;
  --line: #1d3563;
  --fg: #eef3fa;
  --muted: #8ea3c4;
  --chrome: #c9d4e2;      /* plateado de las letras */
  --cyan: #22c3ff;        /* trabajo */
  --royal: #2f63e8;       /* descanso */
  --work: var(--cyan);
  --rest: var(--royal);
  --prep: var(--chrome);
  --phase: var(--prep);
  --f-display: "Russo One", "Arial Black", Impact, sans-serif;
  --f-body: "Barlow", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 60% at 50% 0%, #0f2a5c 0%, var(--bg) 60%) var(--bg) fixed;
  color: var(--fg); font-family: var(--f-body); font-size: 15px; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(12px, env(safe-area-inset-top, 0px));
  padding-bottom: max(28px, env(safe-area-inset-bottom, 0px));
}
* { box-sizing: border-box; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* ---------- Marca ---------- */
.brand { display: flex; align-items: center; gap: 12px; }
.brand img { width: 58px; height: auto; flex: none; filter: drop-shadow(0 0 12px rgba(34,195,255,.35)); }
.brand h1 { margin: 0; font: 400 22px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase;
  background: linear-gradient(180deg, #ffffff 0%, var(--chrome) 55%, #7f8fa6 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand h1 span { display: block; font-size: 13px; letter-spacing: .32em; color: var(--cyan); -webkit-text-fill-color: var(--cyan); margin-top: 4px; }

/* ---------- Pestañas ---------- */
.modes { display: grid; grid-template-columns: 1.2fr repeat(4, 1fr); gap: 4px; background: var(--panel); padding: 4px; border-radius: 12px; border: 1px solid var(--line); }
.modes button { font: 700 12px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; background: transparent; color: var(--muted); border: 0; padding: 11px 2px; border-radius: 8px; }
.modes button[data-mode="mix"] { font-family: var(--f-display); font-weight: 400; letter-spacing: .1em; }
.modes button[aria-pressed="true"] { background: linear-gradient(180deg, var(--cyan), #1597d6); color: #04122a; }

/* ---------- Reloj ---------- */
.clock { position: relative; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); padding: 16px 14px 20px; text-align: center; overflow: hidden; display: flex; flex-direction: column; gap: 6px; }
.clock::before { content: ""; position: absolute; left: 0; bottom: 0; height: 6px; width: var(--progress, 0%); background: var(--phase); transition: width .2s linear; }
.clock .block-name { font: 400 13px/1.2 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); min-height: 1.2em; }
.phase { font: 700 14px/1 var(--f-body); letter-spacing: .24em; text-transform: uppercase; color: var(--phase); }
.time { font: 400 clamp(80px, 26vw, 150px)/1 var(--f-display); font-variant-numeric: tabular-nums; color: var(--fg); }
.clock.running .time { color: var(--phase); text-shadow: 0 0 28px color-mix(in srgb, var(--phase) 45%, transparent); }
.meta { display: flex; justify-content: center; gap: 26px; color: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.meta b { color: var(--fg); font: 400 20px/1 var(--f-display); display: block; margin-top: 4px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.next { font-size: 13px; color: var(--muted); min-height: 1.3em; }
.next strong { color: var(--chrome); }

/* ---------- Controles ---------- */
.controls { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 10px; }
.controls button, .lap { font: 700 14px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: 18px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); }
.controls .primary { background: var(--phase); border-color: transparent; color: #04122a; font-size: 17px; }
.controls button:disabled { opacity: .35; cursor: default; }
.lap { width: 100%; background: var(--panel-2); border-color: var(--cyan); color: var(--cyan); font-size: 16px; padding: 20px; }

/* ---------- Constructor MIX ---------- */
.builder { display: flex; flex-direction: column; gap: 10px; }
.is-running .builder, .is-running .modes { display: none; }
.hint { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 0; }
.blocks { display: flex; flex-direction: column; gap: 8px; }
.block { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.block-head { display: flex; align-items: center; gap: 8px; }
.chip { font: 400 12px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; padding: 6px 9px; border-radius: 6px; background: var(--chip, var(--cyan)); color: #04122a; }
.chip.rest { --chip: var(--royal); color: #fff; }
.chip.work { --chip: var(--chrome); }
.block-head .sum { color: var(--muted); font-size: 13px; flex: 1; min-width: 0; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 14px; line-height: 1; }
.icon-btn.del { color: #ff8a8a; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
.field { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
.stepper button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); font-size: 18px; }
.stepper output { font: 400 22px/1 var(--f-display); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: center; }

.add { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--line); }
.add button { background: var(--panel-2); border: 0; padding: 16px 8px; font: 600 15px/1.1 var(--f-body); }
.add button:disabled { color: var(--muted); opacity: .5; cursor: default; }
.types { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.types button { background: var(--panel); border: 1px solid var(--cyan); color: var(--cyan); border-radius: 10px; padding: 12px 2px; font: 700 12px/1 var(--f-body); letter-spacing: .05em; text-transform: uppercase; }
.mixbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.mixbar .field { flex: 1; min-width: 150px; }
.mixbar .total { font-size: 13px; color: var(--muted); }
.mixbar .total b { font: 400 18px/1 var(--f-display); color: var(--fg); margin-left: 4px; }

.results { background: var(--panel); border: 1px solid var(--cyan); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.results h2 { margin: 0 0 4px; font: 400 15px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); }
.results div { display: flex; justify-content: space-between; font-size: 14px; border-top: 1px solid var(--line); padding-top: 6px; }
.results b { font-variant-numeric: tabular-nums; }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; flex-wrap: wrap; }
.foot label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

/* ---------- v2: ejercicios, guardados, pantalla completa ---------- */
.brand h1 { flex: 1; }
.tv-btn { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 10px 12px; font: 700 12px/1 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--chrome); }
.exercise { font: 700 clamp(20px, 6vw, 30px)/1.15 var(--f-body); color: var(--chrome); min-height: 1.15em; text-wrap: balance; overflow-wrap: anywhere; }
.note { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; color: var(--fg); font: 600 15px/1.2 var(--f-body); }
.note::placeholder { color: var(--muted); font-weight: 400; }
.note:focus { outline: 2px solid var(--cyan); outline-offset: 1px; }
.presets { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.presets h2 { margin: 0; font: 400 13px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); }
.preset-list { display: flex; flex-wrap: wrap; gap: 6px; }
.preset { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel-2); max-width: 100%; }
.preset button { border: 0; background: transparent; padding: 10px 12px; font: 600 14px/1.1 var(--f-body); min-width: 0; overflow-wrap: anywhere; text-align: left; }
.preset .x { border-left: 1px solid var(--line); color: #ff8a8a; padding: 10px; white-space: nowrap; }
.preset-save { display: flex; gap: 8px; }
.preset-save .note { flex: 1; min-width: 0; }
.preset-save button { flex: none; border: 0; border-radius: 10px; padding: 0 16px; background: var(--cyan); color: #04122a; font: 700 14px/1 var(--f-body); letter-spacing: .04em; text-transform: uppercase; }
.saved-msg { font-size: 13px; color: var(--cyan); min-height: 1em; margin: 0; }

/* Modo TV: solo reloj y controles, números enormes */
.app.tv { max-width: none; min-height: calc(100dvh - 48px); }
.app.tv .modes, .app.tv .builder, .app.tv .foot { display: none; }
.app.tv .brand img { width: 40px; }
.app.tv .brand h1 { font-size: 16px; }
.app.tv .clock { flex: 1; justify-content: center; gap: 1.5vh; }
.app.tv .time { font-size: clamp(120px, min(30vw, 42vh), 560px); }
.app.tv .exercise { font-size: clamp(26px, min(5vw, 6vh), 64px); }
.app.tv .phase { font-size: clamp(16px, 2.6vh, 30px); }
.app.tv .block-name, .app.tv .next { font-size: clamp(13px, 2.2vh, 24px); }
.app.tv .meta b { font-size: clamp(20px, 4vh, 48px); }
.app.tv .controls button { padding-block: 22px; }
@media (prefers-reduced-motion: reduce) { .clock::before { transition: none; } }

/* ---------- v5 ---------- */
:root { --work: #ffffff; --rest: #2ee59d; }   /* blanco = trabajo · verde = descanso */
.chip.rest { --chip: var(--rest); color: #04122a; }
.sublabel { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0; }
.ex-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
.warn { font-size: 12.5px; color: #ffd166; margin: 0; line-height: 1.4; }
.people { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.people h2 { margin: 0; font: 400 13px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--cyan); }
.pform { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto; gap: 6px; }
.pform .note { padding: 10px 8px; min-width: 0; }
.pform select.note { appearance: auto; }
.pform button { border: 0; border-radius: 10px; padding: 0 14px; background: var(--cyan); color: #04122a; font: 700 14px/1 var(--f-body); text-transform: uppercase; }
@media (max-width: 560px) { .pform { grid-template-columns: repeat(4, 1fr); } .pform .pn { grid-column: 1 / -1; } .pform button { grid-column: 1 / -1; padding: 12px; } }
.plist { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 6px 6px 6px 10px; font-size: 14px; max-width: 100%; }
.pchip small { color: var(--muted); }
.pchip button { border: 0; background: transparent; color: #ff8a8a; font-size: 14px; padding: 4px 6px; }

.stations { list-style: none; margin: 4px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 14px; text-align: left; font-size: 14px; }
.stations li { overflow-wrap: anywhere; }
.stations b { color: var(--rest); font: 400 14px/1 var(--f-display); margin-right: 6px; }

.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.pcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; text-align: center; min-width: 0; }
.pcard.done { border-color: var(--rest); }
.pcard .pname { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.pcard .pscore { font: 400 30px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.pcard.done .pscore { color: var(--rest); }
.pcard .pscore small { font: 600 12px/1 var(--f-body); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.pbtns { display: flex; gap: 6px; }
.pbtns button { flex: 1; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); padding: 14px 4px; font: 700 14px/1 var(--f-body); text-transform: uppercase; }
.pbtns .go { flex: 2; background: var(--cyan); color: #04122a; border: 0; }
.pbtns button:disabled { opacity: .35; cursor: default; }

.results h3 { margin: 8px 0 0; font: 400 12px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.results .rank b { color: var(--cyan); }
.results .first span, .results .first b { color: var(--rest); }
.congrats { font: 400 16px/1.35 var(--f-display); color: var(--chrome); text-align: center; margin: 10px 0 2px; text-wrap: balance; }
.fine { font-size: 11.5px; color: var(--muted); margin: 0; line-height: 1.4; }
.app.tv .stations, .app.tv .stations b { font-size: clamp(14px, 2.6vh, 28px); }
.app.tv .pcard .pscore { font-size: clamp(30px, 5vh, 56px); }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="brand">
    <img src="logo.png" alt="Logo En el Músculo">
    <h1>En el Músculo<span>Timer</span></h1>
    <button class="tv-btn" id="tv">⛶ Pantalla completa</button>
  </header>

  <nav class="modes" role="group" aria-label="Tipo de sesión">
    <button data-mode="mix">MIX</button>
    <button data-mode="fortime">For Time</button>
    <button data-mode="amrap">AMRAP</button>
    <button data-mode="emom">EMOM</button>
    <button data-mode="tabata">Tabata</button>
  </nav>

  <section class="clock" id="clock">
    <div class="block-name" id="blockName"></div>
    <div class="phase" id="phase">Listo</div>
    <div class="time" id="time">00:00</div>
    <div class="exercise" id="exercise"></div>
    <ol class="stations" id="stations" hidden></ol>
    <div class="meta">
      <div id="blockMeta">Bloque<b id="block">–</b></div>
      <div><span id="roundLabel">Estación</span><b id="round">–</b></div>
      <div>Total<b id="total">00:00</b></div>
    </div>
    <div class="next" id="next"></div>
  </section>

  <div class="controls">
    <button id="reset">Reset</button>
    <button id="start" class="primary">Empezar</button>
    <button id="skip" disabled>Saltar ⏭</button>
  </div>
  <button class="lap" id="lap" hidden>+1 Ronda</button>
  <section class="board" id="board" hidden aria-label="Marcador de participantes"></section>

  <div id="resultsBox"></div>

  <section class="builder" id="builder"></section>

  <div class="foot">
    <label><input type="checkbox" id="sound" checked> Pitidos</label>
    <label><input type="checkbox" id="voice" checked> Voz</label>
    <label><input type="checkbox" id="vibe" checked> Vibración</label>
    <span>v5</span>
  </div>
</div>

<script>
/* =========================================================
   EN EL MÚSCULO TIMER · v5
   Idea central: todo entrenamiento es una lista de BLOQUES,
   y cada bloque se convierte en SEGMENTOS (trozos de tiempo
   con fase: prep / work / rest). El reloj solo recorre segmentos.
   - Modos sueltos (AMRAP, EMOM...) = un MIX de 1 bloque.
   - MIX = varios bloques seguidos, repetidos N vueltas.
   - Los PARTICIPANTES solo viven en memoria: se borran con Reset
     o al cerrar la app. Nunca se guardan.
   ========================================================= */

const COUNT_SET = 15;   // cuenta regresiva en el descanso entre vueltas
const COUNT_PREP = 10;  // cuenta regresiva al empezar
const FINAL = "Trabajo terminado, recuerda que formas parte del team En el Músculo y tu mejor versión empieza aquí.";

// Repite todas las estaciones "Vueltas" veces, con un descanso entre vuelta y vuelta
function withSets(v, stations) {
  const sets = v.sets || 1, out = [];
  for (let s = 1; s <= sets; s++) {
    stations().forEach(seg => out.push({ ...seg, set: s, sets }));
    if (s < sets && v.setRest > 0) out.push({ phase: "rest", label: "Descanso entre vueltas", dur: v.setRest, setRest: true, set: s, sets });
  }
  return out;
}

// ---------- Catálogo de tipos de bloque ----------
const TYPES = {
  fortime: {
    name: "For Time", hint: "Terminen el trabajo lo antes posible. Agrega participantes abajo para tomar el tiempo de cada uno; el reloj sigue hasta que termine el último o llegue el time cap.",
    fields: { cap: { label: "Time cap (min)", value: 10, min: 1, max: 60, step: 1 } },
    sum: v => `cap ${v.cap} min`,
    segs: v => [{ phase: "work", label: "For Time", dur: v.cap * 60, up: true, lap: true }]
  },
  amrap: {
    name: "AMRAP", hint: "Tantas rondas como puedan. Agrega participantes abajo para sumarle rondas a cada uno mientras corre el reloj.",
    fields: { min: { label: "Duración (min)", value: 8, min: 1, max: 60, step: 1 } },
    sum: v => `${v.min} min`,
    segs: v => [{ phase: "work", label: "AMRAP", dur: v.min * 60, lap: true }]
  },
  emom: {
    name: "EMOM", hint: "Al inicio de cada estación se hace el trabajo; lo que sobre es descanso. Escribe el ejercicio de cada estación: la voz lo dirá al empezarla.",
    fields: {
      rounds:  { label: "Estaciones", value: 10, min: 1, max: 60, step: 1 },
      every:   { label: "Cada", value: 60, min: 10, max: 600, step: 5, time: true },
      sets:    { label: "Vueltas", value: 1, min: 1, max: 20, step: 1 },
      setRest: { label: "Descanso entre vueltas", value: 60, min: 0, max: 900, step: 15, time: true }
    },
    sum: v => `${v.rounds} est. × ${fmt(v.every)}${v.sets > 1 ? ` · ${v.sets} vueltas` : ""}`,
    segs: v => withSets(v, () => Array.from({ length: v.rounds }, (_, i) => ({ phase: "work", label: "EMOM", dur: v.every, round: i + 1, rounds: v.rounds })))
  },
  tabata: {
    name: "Tabata", hint: "Intervalos de trabajo y descanso. Escribe el ejercicio de cada estación: la voz lo dirá al empezarla.",
    fields: {
      work:    { label: "Trabajo", value: 20, min: 5, max: 600, step: 5, time: true },
      rest:    { label: "Descanso", value: 10, min: 0, max: 600, step: 5, time: true },
      rounds:  { label: "Estaciones", value: 8, min: 1, max: 50, step: 1 },
      sets:    { label: "Vueltas", value: 1, min: 1, max: 20, step: 1 },
      setRest: { label: "Descanso entre vueltas", value: 60, min: 0, max: 900, step: 15, time: true }
    },
    sum: v => `${v.rounds} est. × ${v.work}s/${v.rest}s${v.sets > 1 ? ` · ${v.sets} vueltas` : ""}`,
    segs: v => withSets(v, () => {
      const out = [];
      for (let i = 1; i <= v.rounds; i++) {
        out.push({ phase: "work", label: "Trabajo", dur: v.work, round: i, rounds: v.rounds });
        if (v.rest > 0 && i < v.rounds) out.push({ phase: "rest", label: "Descanso", dur: v.rest, round: i, rounds: v.rounds });
      }
      return out;
    })
  },
  work: {
    name: "Trabajo", fields: { sec: { label: "Duración", value: 60, min: 5, max: 3600, step: 15, time: true } },
    sum: v => fmt(v.sec), segs: v => [{ phase: "work", label: "Trabajo", dur: v.sec }]
  },
  rest: {
    name: "Descanso", fields: { sec: { label: "Duración", value: 60, min: 5, max: 3600, step: 15, time: true } },
    sum: v => fmt(v.sec), segs: v => [{ phase: "rest", label: "Descanso", dur: v.sec }]
  }
};
const defaults = type => Object.fromEntries(Object.entries(TYPES[type].fields).map(([k, f]) => [k, f.value]));
const isStations = t => t === "emom" || t === "tabata";

// ---------- Estado guardado (en este teléfono) ----------
let state = {
  tab: "mix",
  mix: { rounds: 1, rest: 60, blocks: [
    { type: "tabata", v: defaults("tabata"), ex: ["Burpees", "Sentadillas con salto", "Flexiones", "Mountain climbers", "Burpees", "Sentadillas con salto", "Flexiones", "Mountain climbers"] },
    { type: "rest",   v: { sec: 60 } },
    { type: "amrap",  v: defaults("amrap"), note: "10 KB swings + 10 box jumps + 200 m carrera" },
    { type: "rest",   v: { sec: 60 } },
    { type: "emom",   v: { ...defaults("emom"), rounds: 6 }, ex: ["Thrusters", "Dominadas", "Thrusters", "Dominadas", "Thrusters", "Dominadas"] }
  ]},
  single: {
    fortime: { v: defaults("fortime"), note: "" },
    amrap:   { v: defaults("amrap"), note: "" },
    emom:    { v: defaults("emom"), ex: [] },
    tabata:  { v: defaults("tabata"), ex: [] }
  },
  presets: [],
  prefs: { sound: true, voice: true, vibe: true }
};
let showTypes = false, pendingDelete = -1, savedMsg = "";

// ---------- Participantes: SOLO en memoria, nunca se guardan ----------
let people = [], personSeq = 0;

let plan = [], startedAt = 0, pausedTotal = 0, pausedAt = 0;
let running = false, paused = false, finished = false;
let lastIndex = -1, lastSecond = null, laps = 0, results = [], wakeLock = null;
let log = [], loggedUpTo = 0;   // tiempo real hecho en cada segmento (para resumen y calorías)

const $ = id => document.getElementById(id);
function fmt(s) { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const splitList = t => String(t || "").split(/[,\n]/).map(s => s.trim()).filter(Boolean);

function save() { try { localStorage.setItem("eem-timer", JSON.stringify(state)); } catch (e) {} }

// Arregla bloques de versiones anteriores
function fixBlock(b) {
  if (!b || !TYPES[b.type]) return null;
  b.v = { ...defaults(b.type), ...b.v };
  if (isStations(b.type)) {
    if (!Array.isArray(b.ex)) {
      const l = splitList(b.note);   // v2-v4: ejercicios separados por comas
      b.ex = l.length ? Array.from({ length: b.v.rounds }, (_, i) => l[i % l.length]) : [];
    }
    delete b.note;
  } else if (b.type !== "rest") b.note = b.note || "";
  return b;
}
function fixMix(m) {
  m.blocks = (m.blocks || []).map(fixBlock).filter(Boolean);
  if (m.rest == null) m.rest = 60;
  if (!m.rounds) m.rounds = 1;
  return m;
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem("eem-timer"));
    if (!d || !d.mix) return;
    state.tab = d.tab || "mix";
    state.mix = fixMix(d.mix);
    state.mixRoundsOpen = d.mixRoundsOpen;
    state.presets = (d.presets || []).map(p => ({ name: p.name, mix: fixMix(p.mix) }));
    state.prefs = { ...state.prefs, ...(d.prefs || {}) };
    if (d.single) {
      for (const k of Object.keys(state.single)) if (d.single[k]) state.single[k] = fixBlock({ type: k, ...d.single[k] });
    } else if (d.singles) {   // datos de v4 y anteriores
      for (const k of Object.keys(state.single)) state.single[k] = fixBlock({ type: k, v: d.singles[k] || {}, note: (d.notes || {})[k] || "" });
    }
    for (const k of Object.keys(state.single)) delete state.single[k].type;
  } catch (e) {}
}

// Bloques de la sesión actual (MIX o un modo suelto)
const sessionBlocks = () => state.tab === "mix" ? state.mix.blocks : [{ type: state.tab, ...state.single[state.tab] }];
const sessionRounds = () => state.tab === "mix" ? state.mix.rounds : 1;
const boardActive = () => (state.tab === "amrap" || state.tab === "fortime") && people.length > 0;

// ---------- Nombres de estaciones ----------
const stationNames = b => isStations(b.type) ? Array.from({ length: b.v.rounds }, (_, i) => String(b.ex?.[i] || "").trim()) : [];
function namesOf(b) {
  if (!b || b.type === "rest") return [];
  if (isStations(b.type)) return stationNames(b).map((ex, i) => ({ n: i + 1, ex })).filter(x => x.ex);
  const t = String(b.note || "").trim();
  return t ? [{ n: 0, ex: t }] : [];
}
const namePhrase = x => x.n ? `Estación ${x.n}, ${x.ex}.` : `El circuito es: ${x.ex}.`;
// Segundos que tarda la voz en nombrar la lista (estimado)
const nameTime = list => list.length ? 2.5 + list.reduce((a, x) => a + 0.9 + 0.065 * namePhrase(x).length, 0) : 0;
// En el descanso entre vueltas: segundo (de la cuenta atrás) en que empieza a nombrar las estaciones
function namingAt(seg) {
  const list = seg.nameList || [];
  if (!seg.setRest || !list.length) return -1;
  return Math.max(30, Math.ceil(COUNT_SET + nameTime(list)));
}
const restNeeded = list => Math.max(30, Math.ceil(COUNT_SET + nameTime(list)));

// ---------- Construir el plan: bloques → segmentos ----------
function buildPlan() {
  const blocks = sessionBlocks(), R = sessionRounds();
  const firstWork = blocks.find(b => b.type !== "rest");
  const prepList = namesOf(firstWork);
  const segs = [{ phase: "prep", label: "Prepárate", nameList: prepList,
    dur: prepList.length ? Math.max(15, Math.ceil(COUNT_PREP + nameTime(prepList) + 2)) : 15 }];
  const mixRest = state.tab === "mix" ? state.mix.rest : 0;
  for (let r = 1; r <= R; r++) {
    blocks.forEach((b, bi) => {
      const names = stationNames(b), list = namesOf(b), bname = TYPES[b.type].name;
      TYPES[b.type].segs(b.v).forEach(s => {
        const ex = s.phase !== "work" ? "" : (s.round && isStations(b.type) ? names[s.round - 1] || "" : String(b.note || "").trim());
        segs.push({ ...s, bi, bname, mixRound: r, ex, nameList: s.setRest ? list : undefined });
      });
    });
    if (r < R && mixRest > 0) segs.push({ phase: "rest", label: "Descanso entre vueltas", dur: mixRest, setRest: true, mixSetRest: true,
      bname: "Descanso", bi: blocks.length - 1, mixRound: r, set: r, sets: R, ex: "", nameList: prepList });
  }
  let t = 0;
  for (const s of segs) { s.start = t; t += s.dur; }
  return segs;
}
const totalDur = p => p.reduce((a, s) => a + (s.phase === "prep" ? 0 : s.dur), 0);

// ---------- Calorías (MET corregido con el metabolismo de cada persona) ----------
// Intensidad (MET) aproximada por ejercicio, según el Compendio de Actividades Físicas
const METS = [
  [/cuerda|comba|soga|double ?under|rope/, 11.8], [/sprint/, 12], [/burpee/, 8],
  [/corr|carrera|trote|\brun/, 9.8], [/kettlebell|\bkb\b|swing|pesa rusa/, 9.8],
  [/bici|bike|assault|spinning/, 8.5], [/remo|\brow/, 8.5], [/mountain|escalador/, 8],
  [/box|cajon/, 8], [/wall ?ball|thruster|clean|snatch|cargada|arranque/, 8],
  [/jumping|tijera|salto|jump|skipping/, 8], [/sentadilla|squat/, 5.5],
  [/zancada|lunge|estocada|desplante/, 5], [/flexion|push|lagartija|fondo|\bdip/, 5],
  [/dominada|pull|chin/, 5], [/peso muerto|deadlift|press|banca|bench|mancuerna|dumbbell|barra|curl/, 6],
  [/abdominal|crunch|sit ?up|\babs|v-?up|russian|toes/, 3.8], [/plancha|plank|hollow/, 3.8],
  [/caminar|walk/, 3.5]
];
const norm = t => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function metFor(text) {
  const parts = String(text || "").split(/[,+\n·;/]| y /).map(s => norm(s).trim()).filter(Boolean);
  if (!parts.length) return 7;   // circuito general vigoroso
  const vals = parts.map(p => { for (const [re, m] of METS) if (re.test(p)) return m; return 7; });
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}
const segMet = s => s.phase === "work" ? metFor(s.ex) : s.phase === "rest" ? 2 : 0;
const DEFAULT_P = { name: "", kg: 70, cm: 170, age: 30, sex: "H" };
// Metabolismo en reposo por minuto (Mifflin-St Jeor)
function rmrMin(p) {
  const kg = +p.kg || 70, cm = +p.cm || 170, age = +p.age || 30;
  const bmr = 10 * kg + 6.25 * cm - 5 * age + (p.sex === "M" ? -161 : 5);
  return Math.max(800, bmr) / 1440;
}
const kcalOf = (p, entries) => entries.reduce((a, x) => a + x.secs / 60 * segMet(x.seg) * rmrMin(p), 0);

// ---------- Pintar el constructor ----------
function stepperHTML(id, name, f, value) {
  return `<div class="field">
    <label for="o-${id}-${name}">${f.label}</label>
    <div class="stepper">
      <button data-act="step" data-id="${id}" data-f="${name}" data-d="-1" aria-label="Menos">−</button>
      <output id="o-${id}-${name}">${f.time ? fmt(value) : value}</output>
      <button data-act="step" data-id="${id}" data-f="${name}" data-d="1" aria-label="Más">+</button>
    </div></div>`;
}
// Casilleros de ejercicio (uno por estación) o campo del circuito
function exercisesHTML(id, b) {
  if (b.type === "rest") return "";
  if (isStations(b.type)) {
    let h = `<p class="sublabel">Ejercicio de cada estación</p><div class="ex-list">${Array.from({ length: b.v.rounds }, (_, k) =>
      `<input class="note" data-ex="${id}" data-k="${k}" value="${esc(b.ex?.[k] || "")}" maxlength="40" placeholder="Estación ${k + 1}" aria-label="Ejercicio de la estación ${k + 1}">`).join("")}</div>`;
    const list = namesOf(b);
    if (b.v.sets > 1 && b.v.setRest > 0 && list.length && b.v.setRest < restNeeded(list))
      h += `<p class="warn">Para nombrar ${list.length} estaciones y contar los últimos 15 s, se recomienda un descanso entre vueltas de al menos ${fmt(restNeeded(list))}.</p>`;
    return h;
  }
  return `<input class="note" data-note="${id}" value="${esc(b.note)}" maxlength="160" placeholder="${b.type === "work" ? "Ejercicio: Plancha" : "Circuito: 10 burpees + 15 sentadillas + 200 m carrera"}" aria-label="Ejercicios">`;
}
function peopleHTML() {
  const scoring = state.tab === "amrap" || state.tab === "fortime";
  return `<div class="people"><h2>Participantes de hoy</h2>
    <p class="hint">${scoring ? "Para llevar las rondas o el tiempo de cada uno y calcular sus calorías." : "Para calcular las calorías de cada uno."} Estos datos no se guardan: se borran al tocar Reset o al cerrar la app.</p>
    ${people.length ? `<div class="plist">${people.map(p => `<span class="pchip">${esc(p.name)} <small>${p.kg ? p.kg + " kg" : ""}${p.cm ? " · " + p.cm + " cm" : ""}${p.age ? " · " + p.age + " a" : ""} · ${p.sex === "M" ? "M" : "H"}</small>
      <button data-act="person-del" data-p="${p.id}" aria-label="Quitar a ${esc(p.name)}">✕</button></span>`).join("")}</div>` : ""}
    <div class="pform">
      <input class="note pn" id="pName" maxlength="24" placeholder="Nombre" aria-label="Nombre">
      <input class="note" id="pKg" type="number" inputmode="decimal" min="25" max="250" placeholder="Kg" aria-label="Peso en kilos">
      <input class="note" id="pCm" type="number" inputmode="numeric" min="100" max="230" placeholder="Cm" aria-label="Estatura en centímetros">
      <input class="note" id="pAge" type="number" inputmode="numeric" min="10" max="99" placeholder="Edad" aria-label="Edad">
      <select class="note" id="pSex" aria-label="Sexo"><option value="H">Hombre</option><option value="M">Mujer</option></select>
      <button data-act="person-add">Agregar</button>
    </div>
    <p class="saved-msg" id="pMsg"></p></div>`;
}

function renderBuilder() {
  document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === state.tab));
  $("blockMeta").hidden = state.tab !== "mix";
  let html = "";
  if (state.tab === "mix") {
    const blocks = state.mix.blocks;
    html += `<div class="presets"><h2>Mis entrenamientos</h2>`;
    if (state.presets.length) html += `<div class="preset-list">${state.presets.map((p, i) => `
      <div class="preset">
        <button data-act="preset-load" data-i="${i}" aria-label="Cargar ${esc(p.name)}">${esc(p.name)}</button>
        <button class="x" data-act="preset-del" data-i="${i}" aria-label="Borrar ${esc(p.name)}">${pendingDelete === i ? "¿Borrar?" : "✕"}</button>
      </div>`).join("")}</div>`;
    else html += `<p class="hint">Arma tu MIX abajo y guárdalo con un nombre para cargarlo cuando quieras.</p>`;
    html += `<div class="preset-save">
        <input class="note" id="presetName" maxlength="40" placeholder="Nombre, ej: Lunes piernas" aria-label="Nombre del entrenamiento">
        <button data-act="preset-save" ${blocks.length ? "" : "disabled"}>Guardar</button>
      </div><p class="saved-msg">${esc(savedMsg)}</p></div>`;
    html += `<p class="hint">Combina varios tipos de entrenamiento en una sola sesión. Se ejecutan en orden, de arriba abajo. Las calorías del MIX son un promedio general, solo como orientación.</p>`;
    html += `<div class="blocks">` + blocks.map((b, i) => {
      const T = TYPES[b.type];
      return `<div class="block">
        <div class="block-head">
          <span class="chip ${b.type === "rest" ? "rest" : b.type === "work" ? "work" : ""}">${T.name}</span>
          <span class="sum">${T.sum(b.v)}</span>
          <button class="icon-btn" data-act="up" data-i="${i}" aria-label="Subir" ${i === 0 ? "disabled" : ""}>▲</button>
          <button class="icon-btn" data-act="down" data-i="${i}" aria-label="Bajar" ${i === blocks.length - 1 ? "disabled" : ""}>▼</button>
          <button class="icon-btn del" data-act="del" data-i="${i}" aria-label="Eliminar">✕</button>
        </div>
        <div class="fields">${Object.entries(T.fields).map(([n, f]) => stepperHTML(i, n, f, b.v[n])).join("")}</div>
        ${exercisesHTML(i, b)}
      </div>`;
    }).join("") + `</div>`;
    if (showTypes) html += `<div class="types">${["fortime", "amrap", "emom", "tabata"].map(t => `<button data-act="add" data-type="${t}">${TYPES[t].name}</button>`).join("")}</div>`;
    html += `<div class="add">
      <button data-act="types">+ Tipo de entrenamiento</button>
      <button data-act="add" data-type="work">+ Trabajo</button>
      <button data-act="add" data-type="rest">+ Descanso</button>
      <button data-act="rounds" ${blocks.length ? "" : "disabled"}>+ Vueltas</button>
    </div>`;
    if (blocks.length) {
      const list = namesOf(blocks.find(b => b.type !== "rest"));
      const warn = state.mix.rounds > 1 && state.mix.rest > 0 && list.length && state.mix.rest < restNeeded(list)
        ? `<p class="warn" style="flex-basis:100%">Para nombrar las estaciones y contar los últimos 15 s, se recomienda un descanso entre vueltas de al menos ${fmt(restNeeded(list))}.</p>` : "";
      html += `<div class="mixbar">
      ${state.mix.rounds > 1 || state.mixRoundsOpen ? stepperHTML("mix", "rounds", { label: "Vueltas al MIX" }, state.mix.rounds) + stepperHTML("mix", "rest", { label: "Descanso entre vueltas", time: true }, state.mix.rest) : ""}
      <span class="total">Duración aprox.<b>${fmt(totalDur(buildPlan()))}</b></span>${warn}
    </div>`;
    }
  } else {
    const T = TYPES[state.tab], b = { type: state.tab, ...state.single[state.tab] };
    html += `<p class="hint">${T.hint}</p><div class="fields">${Object.entries(T.fields).map(([n, f]) => stepperHTML("s", n, f, b.v[n])).join("")}</div>`;
    html += exercisesHTML("s", b);
    html += peopleHTML();
  }
  $("builder").innerHTML = html;
}

// ---------- Acciones del constructor ----------
$("builder").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (!b || running) return;
  const blocks = state.mix.blocks, i = Number(b.dataset.i), act = b.dataset.act;
  if (act !== "preset-del") pendingDelete = -1;
  if (act !== "preset-save" && act !== "preset-load") savedMsg = "";
  switch (act) {
    case "person-add": {
      const name = $("pName").value.trim();
      if (!name) { $("pMsg").textContent = "Escribe el nombre del participante."; $("pName").focus(); return; }
      if (people.some(p => p.name.toLowerCase() === name.toLowerCase())) { $("pMsg").textContent = `Ya hay alguien llamado “${name}”. Usa otro nombre o una inicial.`; return; }
      const num = (id, lo, hi) => { const n = parseFloat($(id).value); return n >= lo && n <= hi ? n : null; };
      people.push({ id: ++personSeq, name, kg: num("pKg", 25, 250), cm: num("pCm", 100, 230), age: num("pAge", 10, 99), sex: $("pSex").value, rounds: 0, time: null });
      renderBuilder(); resetClock();
      $("pName")?.focus();
      return;
    }
    case "person-del": people = people.filter(p => p.id !== Number(b.dataset.p)); renderBuilder(); resetClock(); return;
    case "preset-save": {
      const name = $("presetName").value.trim() || `MIX ${state.presets.length + 1}`;
      const copy = JSON.parse(JSON.stringify(state.mix));
      const at = state.presets.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
      if (at >= 0) state.presets[at].mix = copy; else state.presets.push({ name, mix: copy });
      savedMsg = at >= 0 ? `“${name}” actualizado.` : `“${name}” guardado.`;
      break;
    }
    case "preset-load":
      state.mix = fixMix(JSON.parse(JSON.stringify(state.presets[i].mix)));
      state.mixRoundsOpen = state.mix.rounds > 1;
      savedMsg = `“${state.presets[i].name}” cargado. Listo para empezar.`;
      break;
    case "preset-del":
      if (pendingDelete === i) { state.presets.splice(i, 1); pendingDelete = -1; }
      else pendingDelete = i;
      break;
    case "types": showTypes = !showTypes; break;
    case "add": blocks.push(fixBlock({ type: b.dataset.type, v: defaults(b.dataset.type) })); showTypes = false; break;
    case "del": blocks.splice(i, 1); if (!blocks.length) { state.mix.rounds = 1; state.mixRoundsOpen = false; } break;
    case "up": [blocks[i - 1], blocks[i]] = [blocks[i], blocks[i - 1]]; break;
    case "down": [blocks[i + 1], blocks[i]] = [blocks[i], blocks[i + 1]]; break;
    case "rounds": state.mixRoundsOpen = true; if (state.mix.rounds < 2) state.mix.rounds = 2; break;
    case "step": {
      const id = b.dataset.id, name = b.dataset.f, d = Number(b.dataset.d);
      if (id === "mix") {
        if (name === "rest") state.mix.rest = Math.min(900, Math.max(0, state.mix.rest + 15 * d));
        else state.mix.rounds = Math.min(20, Math.max(1, state.mix.rounds + d));
        break;
      }
      const target = id === "s" ? { type: state.tab, v: state.single[state.tab].v } : blocks[Number(id)];
      const f = TYPES[target.type].fields[name];
      target.v[name] = Math.min(f.max, Math.max(f.min, target.v[name] + f.step * d));
      break;
    }
  }
  save(); renderBuilder(); resetClock();
});

// Escribir ejercicios: guardamos sin repintar, para no perder el cursor
$("builder").addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.ex != null) {
    const owner = t.dataset.ex === "s" ? state.single[state.tab] : state.mix.blocks[Number(t.dataset.ex)];
    if (!Array.isArray(owner.ex)) owner.ex = [];
    owner.ex[Number(t.dataset.k)] = t.value;
  } else if (t.dataset.note != null) {
    if (t.dataset.note === "s") state.single[state.tab].note = t.value;
    else state.mix.blocks[Number(t.dataset.note)].note = t.value;
  } else return;
  save(); resetClock();
});
// Enter = guardar / agregar
$("builder").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.id === "presetName") document.querySelector('[data-act="preset-save"]')?.click();
  if (e.target.closest(".pform")) { e.preventDefault(); document.querySelector('[data-act="person-add"]')?.click(); }
});

document.querySelector(".modes").addEventListener("click", e => {
  const b = e.target.closest("button[data-mode]");
  if (!b || running) return;
  state.tab = b.dataset.mode; save(); renderBuilder(); resetClock();
});

// ---------- Sonido ----------
/* Los pitidos se PROGRAMAN por adelantado en el reloj de audio del teléfono. */
let audio = null, scheduled = [], keepAlive = null, endAt = null;
function ctx() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === "suspended") audio.resume().catch(() => {});
  return audio;
}
function tone(freq, ms, at) {
  const a = ctx(), o = a.createOscillator(), g = a.createGain();
  o.type = "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(0.15, at + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, at + ms / 1000);
  o.connect(g).connect(a.destination); o.start(at); o.stop(at + ms / 1000 + 0.02);
  return o;
}
function beep(freq = 880, ms = 160) {
  if (!$("sound").checked) return;
  try { tone(freq, ms, ctx().currentTime + 0.01); } catch (e) {}
}
function clearScheduled() { scheduled.forEach(o => { try { o.stop(); } catch (e) {} }); scheduled = []; endAt = null; }
function scheduleAudio() {
  clearScheduled();
  if (!running || paused || !audio || !$("sound").checked) return;
  try {
    const now = elapsedNow(), base = audio.currentTime;
    const at = t => base + (t - now);
    const countdown = !$("voice").checked || document.hidden;
    plan.forEach((sg, i) => {
      if (i > 0 && sg.start > now) scheduled.push(tone(sg.phase === "rest" ? 520 : 1040, 450, at(sg.start)));
      if (countdown) for (const k of [3, 2, 1]) {
        const t = sg.start + sg.dur - k;
        if (t > now && t > sg.start) scheduled.push(tone(740, 120, at(t)));
      }
    });
    const last = plan[plan.length - 1], end = last.start + last.dur;
    if (end > now) { endAt = at(end); scheduled.push(tone(1200, 700, endAt)); }
  } catch (e) {}
}
function startKeepAlive() {
  if (keepAlive) return;
  try {
    const a = ctx(), o = a.createOscillator(), g = a.createGain();
    o.frequency.value = 40; g.gain.value = 0.002;
    o.connect(g).connect(a.destination); o.start(); keepAlive = o;
  } catch (e) {}
}
function stopKeepAlive() { try { keepAlive?.stop(); } catch (e) {} keepAlive = null; }

// ---------- Reloj interno en un "worker" ----------
let clock = null;
function startClock() {
  if (clock) return;
  try {
    const src = "setInterval(() => postMessage(0), 200);";
    clock = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
    clock.onmessage = () => tick();
  } catch (e) {
    const id = setInterval(tick, 200);
    clock = { terminate: () => clearInterval(id) };
  }
}
function stopClock() { try { clock?.terminate(); } catch (e) {} clock = null; }

// ---------- Voz ----------
let esVoice = null;
function pickVoice() {
  const vs = window.speechSynthesis?.getVoices() || [];
  esVoice = vs.find(v => /^es[-_](US|MX|419|VE|CO)/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const voiceOn = () => $("voice").checked && "speechSynthesis" in window;
function utter(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = esVoice?.lang || "es-ES"; if (esVoice) u.voice = esVoice;
  u.rate = 1.05; u.volume = 1;
  return u;
}
// Una frase (interrumpe la anterior)
function speak(text) {
  if (!voiceOn() || !text) return;
  try { speechSynthesis.cancel(); speechSynthesis.speak(utter(text)); } catch (e) {}
}
// Varias frases seguidas, sin cortarse entre ellas
function speakSeq(lines) {
  if (!voiceOn()) return;
  try { speechSynthesis.cancel(); lines.filter(Boolean).forEach(t => speechSynthesis.speak(utter(t))); } catch (e) {}
}
// 90 → "1 minuto y 30 segundos"
function spoken(s) {
  s = Math.round(s);
  const m = Math.floor(s / 60), r = s % 60;
  const mm = m ? `${m} ${m === 1 ? "minuto" : "minutos"}` : "";
  const ss = r ? `${r} ${r === 1 ? "segundo" : "segundos"}` : "";
  return [mm, ss].filter(Boolean).join(" y ") || "0 segundos";
}
const lapsLeftText = n => n === 1 ? "Falta 1 vuelta" : `Faltan ${n} vueltas`;

// Qué dice la voz al empezar cada segmento
function announce(seg) {
  const next = plan[plan.indexOf(seg) + 1];
  if (seg.setRest) {
    if (namingAt(seg) >= seg.dur - 1) return;   // el descanso es corto: empieza directo nombrando estaciones
    return speak(`Vuelta ${seg.set} de ${seg.sets} terminada. Descanso de ${spoken(seg.dur)}.`);
  }
  if (seg.phase === "rest") return speak(next?.ex ? `Descanso. Siguiente: ${next.ex}` : "Descanso");
  const ex = seg.ex ? ". " + seg.ex : "";
  if (seg.bname === "AMRAP") return speak(`AMRAP, ${spoken(seg.dur)}. ¡Vamos!${ex}`);
  if (seg.bname === "For Time") return speak(`For Time. ¡Vamos!${ex}`);
  const vuelta = seg.sets > 1 && seg.round === 1 ? `Vuelta ${seg.set}. ` : "";
  if (seg.round) return speak(`${vuelta}Estación ${seg.round}${ex}`);
  speak(`¡Trabajo!${ex}`);
}
// Información del descanso entre vueltas
function restInfo(seg, sec) {
  const i = plan.indexOf(seg);
  const after = seg.mixSetRest ? plan.slice(i + 1) : plan.slice(i + 1).filter(s => s.bi === seg.bi && s.mixRound === seg.mixRound);
  const remain = Math.max(30, Math.round(after.reduce((a, s) => a + s.dur, 0) / 30) * 30);
  return `Quedan ${spoken(sec)} de descanso. ${lapsLeftText(seg.sets - seg.set)}, que terminan en unos ${spoken(remain)}.`;
}
// Avisos por segundo
function voiceCue(seg, sec) {
  const say = t => { if (voiceOn()) speak(t); };
  if (seg.phase === "prep" || seg.setRest) {
    const count = seg.setRest ? COUNT_SET : COUNT_PREP;
    if (sec >= 1 && sec <= count && sec < seg.dur) { say(String(sec)); if (sec <= 3) vibrate(80); return; }
    const at = namingAt(seg);
    if (at > 0) {
      const when = Math.min(at, seg.dur - 1);
      if (sec === when) {
        const intro = when === seg.dur - 1
          ? `Vuelta ${seg.set} de ${seg.sets} terminada. ${lapsLeftText(seg.sets - seg.set)}. Recuerden sus estaciones.`
          : `Últimos ${spoken(sec)}. Recuerden sus estaciones.`;
        return speakSeq([intro, ...seg.nameList.map(namePhrase)]);
      }
      if (sec < when) return;   // nombrando estaciones
    }
    if (seg.setRest && sec % 30 === 0 && sec < seg.dur) say(restInfo(seg, sec));
    return;
  }
  if (seg.phase === "rest") {
    const next = plan[plan.indexOf(seg) + 1];
    const from = Math.min(10, seg.dur - (next?.ex ? 5 : 3));
    if (sec >= 1 && sec <= from) { say(String(sec)); if (sec <= 3) vibrate(80); }
    return;
  }
  if (sec >= 1 && sec <= 3) { say(String(sec)); vibrate(80); return; }
  if (seg.up) { if (seg.dur >= 180 && sec === 60) say("Último minuto del time cap"); return; }
  const half = Math.round(seg.dur / 2);
  if (seg.dur >= 10 && sec === half) say(`Quedan ${spoken(half)}`);
  else if (seg.dur >= 180 && sec === 60) say("Último minuto");
}

// ---------- Vibración (Android) ----------
const vibrate = p => { if ($("vibe").checked) try { navigator.vibrate?.(p); } catch (e) {} };
["sound", "voice", "vibe"].forEach(id => $(id).addEventListener("change", () => { state.prefs[id] = $(id).checked; save(); }));

// ---------- Resultados del MIX (botón general +1 Ronda / Terminé) ----------
function recordResult(seg, timeInSeg) {
  if (!seg || !seg.lap || boardActive()) return;
  if (seg.doneAt != null) timeInSeg = seg.doneAt;
  const vuelta = sessionRounds() > 1 ? ` · vuelta ${seg.mixRound}` : "";
  results.push(seg.up
    ? { name: `For Time${vuelta}`, value: timeInSeg >= seg.dur ? `Cap ${fmt(seg.dur)}` : fmt(timeInSeg) }
    : { name: `AMRAP${vuelta}`, value: `${laps} rondas` });
}
// Guarda el tiempo real de los segmentos ya terminados
function logUntil(n) {
  for (let i = loggedUpTo; i < n; i++) {
    const s = plan[i];
    if (s.phase === "prep") continue;
    const secs = s.doneAt ?? s.dur;
    log.push({ seg: s, secs }); recordResult(s, secs);
  }
  loggedUpTo = Math.max(loggedUpTo, n);
}

// ---------- Marcador por participante (AMRAP / For Time) ----------
function renderBoard() {
  const box = $("board");
  if (!boardActive() || !running) { box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  const seg = plan[lastIndex], live = !paused && seg?.phase === "work";
  const amrap = state.tab === "amrap";
  box.innerHTML = people.map(p => {
    if (amrap) return `<div class="pcard"><div class="pname">${esc(p.name)}</div>
      <div class="pscore">${p.rounds} <small>${p.rounds === 1 ? "ronda" : "rondas"}</small></div>
      <div class="pbtns"><button data-act="minus" data-p="${p.id}" ${!live || !p.rounds ? "disabled" : ""} aria-label="Restar ronda a ${esc(p.name)}">−1</button>
      <button class="go" data-act="plus" data-p="${p.id}" ${live ? "" : "disabled"}>+1 Ronda</button></div></div>`;
    if (p.time != null) return `<div class="pcard done"><div class="pname">${esc(p.name)}</div>
      <div class="pscore">${fmt(p.time)}</div>
      <div class="pbtns"><button data-act="undo" data-p="${p.id}" ${live ? "" : "disabled"}>Deshacer</button></div></div>`;
    return `<div class="pcard"><div class="pname">${esc(p.name)}</div>
      <div class="pscore"><small>en curso</small></div>
      <div class="pbtns"><button class="go" data-act="done" data-p="${p.id}" ${live ? "" : "disabled"}>Terminó</button></div></div>`;
  }).join("");
}
$("board").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (!b || !running || paused) return;
  const p = people.find(x => x.id === Number(b.dataset.p)), seg = plan[lastIndex];
  if (!p || seg?.phase !== "work") return;
  switch (b.dataset.act) {
    case "plus": p.rounds++; beep(1320, 80); vibrate(40); speak(`${p.name}, ${p.rounds} ${p.rounds === 1 ? "ronda" : "rondas"}`); break;
    case "minus": if (p.rounds > 0) { p.rounds--; speak(`Corrección. ${p.name}, ${p.rounds} ${p.rounds === 1 ? "ronda" : "rondas"}`); } break;
    case "done":
      p.time = Math.min(seg.dur, elapsedNow() - seg.start);
      beep(1320, 120); vibrate(60);
      if (people.every(x => x.time != null)) { renderBoard(); return finish(); }
      speak(`${p.name} terminó. ${spoken(p.time)}`);
      break;
    case "undo": p.time = null; speak(`${p.name} sigue en curso`); break;
  }
  renderBoard();
});

// Posiciones de AMRAP o For Time
const ORD = ["", "Primer", "Segundo", "Tercer", "Cuarto", "Quinto", "Sexto", "Séptimo", "Octavo", "Noveno", "Décimo"];
const placeName = n => n <= 10 ? `${ORD[n]} lugar` : `Lugar ${n}`;
const joinNames = a => a.length < 2 ? (a[0] || "") : a.slice(0, -1).join(", ") + " y " + a[a.length - 1];
function ranking() {
  const speech = [], rows = [];
  if (state.tab === "amrap") {
    const rr = n => `${n} ${n === 1 ? "ronda" : "rondas"}`;
    const sorted = [...people].sort((a, b) => b.rounds - a.rounds);
    sorted.forEach(p => { p.place = 1 + people.filter(q => q.rounds > p.rounds).length; rows.push({ place: p.place, name: p.name, val: rr(p.rounds), p }); });
    if (people.length === 1) speech.push(`${people[0].name}: ${rr(people[0].rounds)}.`);
    else {
      const groups = [];
      sorted.forEach(p => { const g = groups.find(g => g.place === p.place); g ? g.names.push(p.name) : groups.push({ place: p.place, n: p.rounds, names: [p.name] }); });
      groups.reverse().forEach(g => {
        if (g.place === 1) speech.push(g.names.length > 1 ? `¡Empate en el primer lugar! ${joinNames(g.names)}, con ${rr(g.n)}.` : `¡Y el ganador es ${g.names[0]}, con ${rr(g.n)}!`);
        else speech.push(`${g.names.length > 1 ? "Empate en el " + placeName(g.place).toLowerCase() : placeName(g.place)}: ${joinNames(g.names)}, ${rr(g.n)}.`);
      });
      speech.push("¡Felicidades a los ganadores!");
    }
  } else {
    const done = people.filter(p => p.time != null).sort((a, b) => a.time - b.time), dnf = people.filter(p => p.time == null);
    done.forEach((p, i) => { p.place = i + 1; rows.push({ place: p.place, name: p.name, val: fmt(p.time), p }); });
    dnf.forEach(p => rows.push({ place: "—", name: p.name, val: "Time cap", p }));
    if (people.length === 1) {
      const p = people[0];
      speech.push(p.time != null ? `${p.name} terminó en ${spoken(p.time)}.` : `${p.name} no completó dentro del time cap.`);
    } else {
      if (dnf.length) speech.push(`${dnf.length === 1 ? "No completó" : "No completaron"} dentro del time cap: ${joinNames(dnf.map(p => p.name))}.`);
      for (let i = done.length - 1; i >= 0; i--) {
        const p = done[i];
        speech.push(i === 0 ? `¡Y el ganador es ${p.name}, con un tiempo de ${spoken(p.time)}!` : `${placeName(i + 1)}: ${p.name}, ${spoken(p.time)}.`);
      }
      if (done.length) speech.push("¡Felicidades a los ganadores!");
    }
  }
  return { speech, rows };
}

// Resumen final: estadísticas, calorías y felicitación
function buildSummary() {
  const entries = log.filter(x => x.seg.phase !== "prep");
  const total = entries.reduce((a, x) => a + x.secs, 0);
  const work = entries.filter(x => x.seg.phase === "work").reduce((a, x) => a + x.secs, 0);
  const isMix = state.tab === "mix", b0 = sessionBlocks()[0];
  const lapsN = isMix ? state.mix.rounds : (b0.v.sets || 1);
  const stations = !isMix && isStations(b0.type) ? b0.v.rounds : 0;
  const speech = [];
  let html = `<div class="results"><h2>Resultados</h2>`;

  // Posiciones
  if (boardActive()) {
    const r = ranking();
    speech.push(...r.speech);
    html += `<h3>Posiciones</h3>` + r.rows.map(x => `<div class="rank ${x.place === 1 ? "first" : ""}"><span><b>${x.place}${typeof x.place === "number" ? "°" : ""}</b> ${esc(x.name)}</span><b>${x.val}</b></div>`).join("");
  }
  // Resultados generales del MIX
  if (results.length) html += `<h3>Marcas</h3>` + results.map(r => `<div><span>${r.name}</span><b>${r.value}</b></div>`).join("");

  // Estadísticas
  let line = "Circuito completado. ";
  if (stations) line += lapsN > 1 ? `Hicieron ${lapsN} vueltas de ${stations} estaciones. ` : `Hicieron ${stations} estaciones. `;
  else if (isMix && lapsN > 1) line += `Hicieron ${lapsN} vueltas al MIX. `;
  line += `Tiempo total: ${spoken(total)}, con ${spoken(work)} de trabajo.`;
  speech.push(line);
  html += `<h3>Resumen</h3>
    <div><span>Tiempo total</span><b>${fmt(total)}</b></div>
    <div><span>Tiempo de trabajo</span><b>${fmt(work)}</b></div>
    <div><span>Descanso</span><b>${fmt(total - work)}</b></div>
    ${stations ? `<div><span>Estaciones</span><b>${stations}</b></div>` : ""}
    ${lapsN > 1 ? `<div><span>Vueltas</span><b>${lapsN}</b></div>` : ""}`;

  // Calorías
  const ppl = !isMix && people.length ? people : null;
  const cal = (ppl || [DEFAULT_P]).map(p => {
    const ent = ppl && state.tab === "fortime" ? entries.map(x => x.seg.phase === "work" ? { seg: x.seg, secs: p.time ?? x.secs } : x) : entries;
    const k = kcalOf(p, ent), mins = ent.reduce((a, x) => a + x.secs, 0) / 60;
    return { p, k: Math.round(k), perMin: mins ? Math.round(k / mins) : 0 };
  });
  if (!ppl) speech.push(`Gasto calórico ${isMix ? "orientativo" : "aproximado"}: unas ${cal[0].k} calorías, ${cal[0].perMin} por minuto.`);
  else if (ppl.length === 1) speech.push(`${cal[0].p.name}, gastaste aproximadamente ${cal[0].k} calorías, unas ${cal[0].perMin} por minuto.`);
  else {
    const avg = Math.round(cal.reduce((a, c) => a + c.k, 0) / cal.length), pm = Math.round(cal.reduce((a, c) => a + c.perMin, 0) / cal.length);
    speech.push(`Gasto calórico aproximado del grupo: en promedio ${avg} calorías por persona, unas ${pm} por minuto.`);
  }
  html += `<h3>Calorías estimadas${isMix ? " (orientativo)" : ""}</h3>` + cal.map(c =>
    `<div><span>${c.p.name ? esc(c.p.name) : "Persona promedio (70 kg)"}</span><b>${c.k} kcal · ${c.perMin}/min</b></div>`).join("");
  if (ppl && ppl.length > 1) html += `<div><span>Promedio del grupo</span><b>${Math.round(cal.reduce((a, c) => a + c.k, 0) / cal.length)} kcal</b></div>`;

  speech.push(FINAL);
  html += `<p class="congrats">${FINAL}</p>
    <p class="fine">Calorías estimadas según la intensidad de cada ejercicio, el tiempo y los datos de cada persona. Es una aproximación: no sustituye la medición de un pulsómetro.</p></div>`;
  return { speech, html };
}

// ---------- El corazón: tick() ----------
const elapsedNow = () => (performance.now() - startedAt - pausedTotal) / 1000;

function renderStations(seg) {
  const el = $("stations"), list = seg && (seg.phase === "prep" || seg.setRest) ? (seg.nameList || []).filter(x => x.n) : [];
  el.hidden = !list.length;
  el.innerHTML = list.map(x => `<li><b>${x.n}</b>${esc(x.ex)}</li>`).join("");
}

function tick() {
  if (!running || paused) return;
  const elapsed = elapsedNow();
  const idx = plan.findIndex(s => elapsed < s.start + s.dur);
  if (idx === -1) return finish();
  const seg = plan[idx], inSeg = elapsed - seg.start, left = seg.dur - inSeg;

  if (idx !== lastIndex) {                         // entramos en un segmento nuevo
    const first = lastIndex === -1;
    logUntil(idx);
    if (!first) { vibrate(seg.phase === "rest" ? 200 : [300, 100, 300]); announce(seg); }
    if (seg.lap) laps = 0;
    lastIndex = idx; lastSecond = null;
    updateButtons(); renderStations(seg); renderBoard();
  }
  const sec = Math.ceil(left);
  if (sec !== lastSecond) {
    if (lastSecond !== null) voiceCue(seg, sec);
    lastSecond = sec;
  }

  document.documentElement.style.setProperty("--phase", `var(--${seg.phase})`);
  const nBlocks = sessionBlocks().length, R = sessionRounds();
  $("blockName").textContent = seg.phase === "prep" ? (plan[1]?.bname || "")
    : seg.bname + (seg.sets > 1 ? ` · vuelta ${seg.set}/${seg.sets}` : "") + (R > 1 ? ` · MIX ${seg.mixRound}/${R}` : "");
  $("phase").textContent = seg.label;
  $("exercise").textContent = seg.phase === "prep" ? (plan[1]?.ex || "") : seg.ex;
  $("time").textContent = seg.up ? fmt(Math.floor(inSeg)) : fmt(left);
  $("clock").style.setProperty("--progress", (inSeg / seg.dur * 100).toFixed(1) + "%");
  $("block").textContent = seg.phase === "prep" ? `0/${nBlocks}` : `${seg.bi + 1}/${nBlocks}`;
  if (boardActive()) {   // con participantes: cuántos terminaron (For Time) o rondas totales (AMRAP)
    const ft = state.tab === "fortime";
    $("roundLabel").textContent = ft ? "Terminaron" : "Rondas totales";
    $("round").textContent = ft ? `${people.filter(p => p.time != null).length}/${people.length}` : people.reduce((a, p) => a + p.rounds, 0);
  } else {
    $("roundLabel").textContent = seg.lap && !seg.up ? "Rondas" : "Estación";
    $("round").textContent = seg.round ? `${seg.round}/${seg.rounds}` : seg.lap ? laps : "–";
  }
  $("total").textContent = fmt(Math.max(0, elapsed - plan[0].dur));
  const nx = plan[idx + 1];
  $("next").innerHTML = nx ? `Siguiente: <strong>${nx.bname && nx.bi !== seg.bi ? nx.bname + " · " : ""}${nx.label} ${fmt(nx.dur)}${nx.ex ? " · " + esc(nx.ex) : ""}</strong>` : "Último intervalo";
}

// ---------- Controles ----------
async function start() {
  if (finished) resetClock();
  if (!running) {
    plan = buildPlan();
    if (plan.length < 2) { $("phase").textContent = "Añade un bloque al MIX"; return; }
    startedAt = performance.now(); pausedTotal = 0; laps = 0; results = []; lastIndex = -1; lastSecond = null;
    log = []; loggedUpTo = 0;
    people.forEach(p => { p.rounds = 0; p.time = null; });
    running = true; paused = false; $("resultsBox").innerHTML = "";
    try { ctx(); } catch (e) {}   // el audio se activa con este toque
    const list = plan[0].nameList;   // la voz necesita este toque para activarse
    if (list.length) speakSeq(["Prepárate. Estas son las estaciones.", ...list.map(namePhrase)]);
    else speak("Prepárate");
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {}
  } else if (paused) { pausedTotal += performance.now() - pausedAt; paused = false; }
  else { paused = true; pausedAt = performance.now(); }
  $("app").classList.toggle("is-running", running);
  $("clock").classList.toggle("running", running && !paused);
  if (paused) {
    $("phase").textContent = "Pausa";
    clearScheduled(); stopClock(); stopKeepAlive();
    try { speechSynthesis.cancel(); } catch (e) {}
  } else {
    startKeepAlive(); scheduleAudio(); startClock(); tick();
  }
  updateButtons(); renderBoard();
}

// Saltar = adelantar el reloj hasta el final del segmento actual
function skip() {
  if (!running || paused) return;
  const seg = plan[lastIndex];
  if (!seg) return;
  seg.doneAt = elapsedNow() - seg.start;
  pausedTotal -= (seg.start + seg.dur - elapsedNow()) * 1000 + 1;
  const next = plan[lastIndex + 1];
  if (next) beep(next.phase === "rest" ? 520 : 1040, 450);
  scheduleAudio(); tick();
}

function finish() {
  const e = elapsedNow(), idx = plan.findIndex(s => e < s.start + s.dur);
  if (idx === -1) logUntil(plan.length);
  else {   // terminó antes de tiempo (todos marcaron "Terminó")
    logUntil(idx);
    const s = plan[idx];
    if (s.phase !== "prep") { const secs = Math.max(0, Math.min(s.dur, e - s.start)); log.push({ seg: s, secs }); recordResult(s, secs); }
    loggedUpTo = idx + 1;
  }
  running = false; finished = true;
  if (!endAt || !audio || audio.currentTime > endAt + 1 || idx !== -1) { clearScheduled(); beep(1200, 700); }
  endAt = null; scheduled = []; stopClock(); stopKeepAlive();
  vibrate([400, 150, 400, 150, 600]);
  const sum = buildSummary();
  speakSeq(sum.speech);
  $("exercise").textContent = "";
  $("stations").hidden = true;
  $("phase").textContent = "¡Terminado!";
  $("time").textContent = fmt(Math.max(0, e - plan[0].dur));
  $("next").textContent = "Tu mejor versión empieza aquí.";
  document.documentElement.style.setProperty("--phase", "var(--rest)");
  $("clock").style.setProperty("--progress", "100%");
  $("clock").classList.remove("running");
  $("app").classList.remove("is-running");
  $("resultsBox").innerHTML = sum.html;
  try { wakeLock?.release(); } catch (e2) {}
  updateButtons(); renderBoard();
}

function resetClock() {
  running = paused = finished = false; laps = 0;
  clearScheduled(); stopClock(); stopKeepAlive();
  plan = buildPlan();
  document.documentElement.style.setProperty("--phase", "var(--prep)");
  const first = plan[1];
  $("blockName").textContent = first ? first.bname : "";
  $("phase").textContent = first ? "Listo" : "Añade bloques al MIX";
  $("exercise").textContent = first?.ex || "";
  renderStations(null);
  try { speechSynthesis?.cancel(); } catch (e) {}
  $("time").textContent = first ? (first.up ? "00:00" : fmt(first.dur)) : "00:00";
  $("block").textContent = `0/${sessionBlocks().length}`;
  $("round").textContent = "–";
  $("total").textContent = fmt(totalDur(plan));
  $("next").textContent = boardActive() ? `${people.length} ${people.length === 1 ? "participante" : "participantes"}` : "";
  $("clock").style.setProperty("--progress", "0%");
  $("clock").classList.remove("running");
  $("app").classList.remove("is-running");
  $("resultsBox").innerHTML = "";
  try { wakeLock?.release(); } catch (e) {}
  updateButtons(); renderBoard();
}

function updateButtons() {
  $("start").textContent = !running ? (finished ? "Otra vez" : "Empezar") : paused ? "Seguir" : "Pausa";
  const seg = running ? plan[lastIndex] : null, board = boardActive();
  $("skip").disabled = !(running && !paused) || (board && state.tab === "fortime" && seg?.phase === "work");
  $("skip").textContent = seg?.up && !board ? "Terminé ✓" : "Saltar ⏭";
  $("lap").hidden = board || !(seg && seg.lap && !seg.up);
}

$("start").addEventListener("click", start);
// Reset: reinicia el reloj y BORRA los participantes
$("reset").addEventListener("click", () => { people = []; renderBuilder(); resetClock(); });
$("skip").addEventListener("click", skip);
$("lap").addEventListener("click", () => { laps++; beep(1320, 80); $("round").textContent = laps; });
document.addEventListener("keydown", e => { if (e.code === "Space" && e.target === document.body) { e.preventDefault(); start(); } });

// ---------- Pantalla completa / modo TV ----------
function setTV(on) {
  $("app").classList.toggle("tv", on);
  $("tv").textContent = on ? "✕ Salir" : "⛶ Pantalla completa";
}
$("tv").addEventListener("click", async () => {
  const on = !$("app").classList.contains("tv");
  setTV(on);
  try {
    if (on && !document.fullscreenElement) await document.documentElement.requestFullscreen?.();
    if (!on && document.fullscreenElement) await document.exitFullscreen?.();
  } catch (e) {}
});
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) setTV(false); });

document.addEventListener("visibilitychange", async () => {
  if (!running || paused) return;
  scheduleAudio(); tick();
  if (document.visibilityState === "visible") {
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch (e) {}
  }
});
["sound", "voice"].forEach(id => $(id).addEventListener("change", () => scheduleAudio()));

load();
save();
["sound", "voice", "vibe"].forEach(id => { $(id).checked = state.prefs[id] !== false; });
if (!navigator.vibrate) $("vibe").parentElement.hidden = true;
if (!("speechSynthesis" in window)) $("voice").parentElement.hidden = true;
renderBuilder();
resetClock();
</script>

<script>
// Registrar el service worker: permite instalar la app y usarla sin internet
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
